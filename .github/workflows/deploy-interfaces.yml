name: Deploy simulated interfaces

on:
  push:
    branches:
      - main
    paths:
      - "interfaces.csv"
      - "inventory.json"
      - "deploy_interfaces.py"
      - "validate_interfaces.py"
      - ".github/workflows/deploy-interfaces.yml"
  pull_request:
    branches:
      - main
    paths:
      - "interfaces.csv"
      - "inventory.json"
      - "deploy_interfaces.py"
      - "validate_interfaces.py"
      - ".github/workflows/deploy-interfaces.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build simulated device state for review
        run: python deploy_interfaces.py

      - name: Validate proposed interface changes
        run: python validate_interfaces.py

  deploy-after-approval:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deploy approved interface source of truth
        run: python deploy_interfaces.py

      - name: Validate approved simulated device state
        run: python validate_interfaces.py

      - name: Open PR for updated simulated devices
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update simulated device state
          title: Update simulated device state
          body: |
            This PR was created automatically after approved interface changes were merged.

            It updates the simulated device JSON files from `interfaces.csv`.
          branch: bot/update-simulated-device-state
          delete-branch: true
          add-paths: simulated_devices
