name: Deploy simulated interfaces

on:
  push:
    paths:
      - "interfaces.csv"
      - "inventory.json"
      - "deploy_interfaces.py"
      - "validate_interfaces.py"
      - ".github/workflows/deploy-interfaces.yml"
  pull_request:
    paths:
      - "interfaces.csv"
      - "inventory.json"
      - "deploy_interfaces.py"
      - "validate_interfaces.py"
      - ".github/workflows/deploy-interfaces.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-interfaces:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deploy interface source of truth to simulated devices
        run: python deploy_interfaces.py

      - name: Validate simulated device state
        run: python validate_interfaces.py

      - name: Commit updated simulated devices
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add simulated_devices
          if ! git diff --cached --quiet; then
            git commit -m "Update simulated device state"
            git push
          fi
